name: Build Windows (CN)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildWindows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelibs
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp --quiet
          haxelib install lpm --quiet
          haxelib run lpm install

      - name: Version Tag
        shell: cmd
        run: echo %GITHUB_RUN_ID%> VERSION

      - name: Compile
        shell: cmd
        run: haxelib run lime build Project.xml windows

      - name: Zip Release
        shell: pwsh
        run: |
          if (Test-Path export/release/windows/bin) {
            Compress-Archive -Path export/release/windows/bin/* -DestinationPath PsychOnline-CN-windows.zip -Force
            Get-Item PsychOnline-CN-windows.zip | Select-Object Name,Length
          } else {
            Write-Error 'export/release/windows/bin not found'
            Get-ChildItem -Recurse export/release -ErrorAction SilentlyContinue | Select-Object FullName
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsychOnline-CN-windows
          path: export/release/windows/bin

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doubao-po-windows
          name: Psych Online 汉化版 (Windows)
          prerelease: true
          overwrite_files: true
          files: PsychOnline-CN-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
